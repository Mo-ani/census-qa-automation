# ---------------------------------------------------------------------------
# Census App - test configuration
#
# Every key can be overridden without editing this file:
#   1. JVM system property    mvn test -Dbrowser=edge -Dheadless=true
#   2. Environment variable   BASE_URL=http://localhost:3000   (upper case, dots -> underscores)
#   3. The value below        (default)
# ---------------------------------------------------------------------------

# --- Application under test -------------------------------------------------
base.url=http://localhost:3000
# Time zone the application SERVER runs in. The Docker container runs in UTC.
# It is used to turn the API/DB timestamp of "dob" back into a calendar date.
app.timezone=UTC

# --- Browser ----------------------------------------------------------------
# chrome | edge | firefox
browser=chrome
headless=false
window.size=1440,1000
# The app's record dialog cannot be scrolled. If a visible browser window is lower than this
# (CSS pixels; happens on small or scaled laptop screens) the page is zoomed out to fit.
# Chrome and Edge only; 0 switches it off.
min.viewport.height=800
explicit.wait.seconds=10
# Time zone the browser reports to the page (blank = time zone of this machine).
# Pinned to the server time zone so "Date of Birth" renders the same on every machine.
browser.timezone=UTC
# failure = screenshot only when a scenario fails | always = after every UI scenario
screenshot.mode=always

# --- Test user (fictional - never use real personal data) --------------------
test.user.name=FAKE QA User4
test.user.email=fake.qa.user4@example.com
test.user.password=Fake#12345

# --- Database (PostgreSQL from docker-compose.yml) ---------------------------
db.url=jdbc:postgresql://localhost:5432/census_app
db.user=postgres
db.password=postgres

# --- Test data housekeeping --------------------------------------------------
# true  = records created by a scenario are deleted again in the After hook
# false = keep them, e.g. to inspect the rows in pgAdmin / DBeaver after a run
cleanup.created.records=true
# Folder where the submitted person data is stored as JSON (one file per person)
test.data.dir=target/test-data
